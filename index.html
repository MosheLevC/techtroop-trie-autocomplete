<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>responsive text</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="index.js" defer></script>
  </head>
  <body>
    <section class="container">
      <div class="add-word-row">
        <div class="input-group">
          <input id="add-input" class="input-field add-input" type="text" placeholder="Enter a word to add to dictionary" />
          <button id="add-button" class="add-button">Add Word</button>
        </div>
        <div class="message-area">
          <p id="message" class="message"></p>
        </div>
      </div>
      <div class="autocomplete-row">
        <input id="autocomplete-input" class="input-field autocomplete-input" type="text" placeholder="Start typing to see suggestions..." />
      </div>
      <ul id="suggestions-list" class="suggestions-list"></ul>
      <div class="stats-row">
        <p id="word-count" class="word-count"></p>
        <p>Words in dictionary</p>
      </div>
    </section>
  </body>
</html>
